name: CI Build

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate Gradle wrapper
        run: |
          echo 'sdk.dir=' >> local.properties
          chmod +x ./gradlew

      - name: Gradle compile (debug)
        run: ./gradlew :app:compileDebugJavaWithJavac --stacktrace

      - name: Gradle unit tests
        run: ./gradlew :app:testDebugUnitTest --continue

      - name: Build release APK (unsigned fallback)
        run: ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Verify APK artifacts
        run: |
          ls -lh app/build/outputs/apk/
          test -f app/build/outputs/apk/release/app-release-unsigned.apk \
            -o -f app/build/outputs/apk/release/app-release.apk
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APKs (debug + release)
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-android44-apk-${{ github.run_id }}
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/apk/**/*.aab
          if-no-files-found: warn

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tvbox-android44-buildlogs-${{ github.run_id }}
          path: |
            app/build/reports/**
          if-no-files-found: ignore
